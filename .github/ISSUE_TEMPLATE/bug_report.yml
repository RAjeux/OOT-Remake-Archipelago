name: Signaler un bug
description: Décrire un problème avec l'alpha Triforce.
body:
  - type: input
    id: version
    attributes:
      label: Version du pack et de Triforce
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes et résultat observé
      description: Préciser l'objet ou l'emplacement concerné et le résultat attendu.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Extraits utiles du diagnostic
      description: Retirer les mots de passe, adresses privées et chemins personnels. Ne pas joindre de fichiers du jeu ou de sauvegarde.
