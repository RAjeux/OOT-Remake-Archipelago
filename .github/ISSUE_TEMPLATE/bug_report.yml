name: Bug report
description: Report a problem with the Triforce alpha.
body:
  - type: input
    id: version
    attributes:
      label: Release and Triforce versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce and observed behavior
      description: Include the affected item or location and the expected result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant diagnostic excerpts
      description: Remove passwords, private addresses, and personal paths. Do not attach game files or saves.
