name: Checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -X utf8 tools/test.py
      - name: Verify the development candidate against current sources
        run: python -X utf8 tools/verify_candidate.py
      - name: Verify the immutable release reference
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne $expected) {
            Write-Error 'The release tag must match VERSION.'
            exit 1
          }
          python -X utf8 tools/verify_release.py
      - run: python -m pip install -r requirements-app.txt
      - run: python tools/build_app.py --output build/ci-application --work build/application-ci
      - name: Inspect and run the standalone application
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $application = (Resolve-Path "build/ci-application/OOT-Remake-Archipelago-$version.exe").Path
          python tools/verify_app.py $application --output build/ci-application/inspection.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkRoot = Join-Path $env:RUNNER_TEMP 'ootrr-standalone-smoke'
          New-Item -ItemType Directory -Path $checkRoot -Force | Out-Null
          $result = Join-Path $checkRoot 'result.json'
          $env:LOCALAPPDATA = Join-Path $checkRoot 'local'
          $env:APPDATA = Join-Path $checkRoot 'roaming'
          $env:PATH = "$env:SystemRoot\System32"
          Remove-Item Env:OOTRR_NODE -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $application -ArgumentList @('--self-test', ('"{0}"' -f $result)) -Wait -PassThru -WindowStyle Hidden
          if (Test-Path -LiteralPath $result) { Get-Content -LiteralPath $result }
          if ($process.ExitCode -ne 0) {
            $diagnostic = Join-Path $env:LOCALAPPDATA 'OOTRR-Archipelago/diagnostics/application.log'
            if (Test-Path -LiteralPath $diagnostic) { Get-Content -LiteralPath $diagnostic -Tail 150 }
            exit $process.ExitCode
          }
          if (!(Test-Path -LiteralPath $result)) {
            Write-Error 'The standalone smoke test did not produce its result file.'
            exit 1
          }
          $report = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          if ($report.result -ne 'PASS' -or !$report.frozen -or !$report.persistent_node_engine) { exit 1 }
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.24.9'
          cache-dependency-path: native/go.sum
      - run: go test -mod=vendor -race ./...
        working-directory: native
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -X utf8 tools/test_bridge.py --cc gcc --cxx g++
      - name: Check source bootstrap paths with native Linux symlinks
        run: |
          python -X utf8 tests/test_dev_setup.py
          python -X utf8 tests/test_ap_test_env.py
  engine:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/rust-ci
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install the validated Rust compiler and WASI target
        run: rustup toolchain install 1.99.0 --profile minimal --target wasm32-wasip1
      - name: Test the Rust engine source
        run: cargo +1.99.0 test --locked --offline --profile ci -p ootrr-core -p ootrr-game -p ootrr-logic -p ootrr-cosmetics
        working-directory: moteur/ootrr-ap
      - name: Build a fresh WASM without replacing the packaged engine
        run: cargo +1.99.0 build --locked --offline --release --target wasm32-wasip1 -p ootrr-core --bin ootrr_ap
        working-directory: moteur/ootrr-ap
      - name: Validate the freshly built engine through Node and the Python adapter
        run: python -X utf8 tools/test_built_engine.py --engine build/rust-ci/wasm32-wasip1/release/ootrr_ap.wasm
