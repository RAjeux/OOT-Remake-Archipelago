# New full-network engine. Use ONE Zelda example, plus the other players' YAMLs.
# Generate with the matching 0.11 APWorld; prepare a fresh save for this room.
name: Zelda
game: "Ocarina of Time Remake"
"Ocarina of Time Remake":
  generation_mode: full_network

  # Supported source families already default to on. Their actual eligible
  # locations participate in AP; an item can belong to any player.
  full_tokensanity: all
  full_shopsanity: all
  full_shuffle_song_items: everywhere
  full_shuffle_cows: true
  full_shuffle_bean_merchant: true
  full_adult_trade_shuffle: true
  full_shuffle_master_sword: true

  # Buy the ten bean checks and receive the beans through AP.
  # Set true only if you explicitly want the bean routes planted from the start.
  full_plant_beans: false

  # Shared native Triforce/Hookshot deaths. The experimental external runtime
  # does not implement DeathLink.
  death_link: true
