# Example: supported Gold Skulltula drops participate in Archipelago.
# Use a new room and prepare its mod with the matching client release.
name: Zelda
game: "Ocarina of Time Remake"
"Ocarina of Time Remake":
  shuffle_chests: all
  # Values: off (unchanged), pinned (44-site subset), matched (all 100 native sites).
  shuffle_skulltulas: matched
  # Pre-plant the native bean platforms. All selected sites still become AP checks
  # without this shortcut; known optional bean routes use conservative late rules.
  plant_beans: true
  # The 23 uncertain sites remain AP checks but are filler-only: no progression
  # or Zelda tokens. The expanded catalogue has not been manually completed.
  death_link: false
