# Exemple local à deux joueurs : Zelda + Ami (Dark Souls III).
name: Zelda
game: "Ocarina of Time Remake"
"Ocarina of Time Remake":
  # Objectif fixe : vaincre Ganon. Réglages compatibles AP uniquement.

  # Shuffle
  # Coffres mélangés : partout, hors donjons ou dans les donjons. Seuls les coffres du catalogue
  # AP deviennent des checks réseau.
  # Valeurs : all, overworld, dungeons
  shuffle_chests: "all"

  # Dungeon items
  # Petites clés : emplacement habituel, donjon d'origine, n'importe quel donjon ou partout. Les
  # deux derniers choix exigent les coffres de donjon mélangés.
  # Valeurs : vanilla, dungeon, any_dungeon, keysanity
  shuffle_smallkeys: "dungeon"
  # Placement des clés de boss. remove donne leur accès dès le début. Les placements hors du
  # donjon d'origine exigent les coffres de donjon mélangés.
  # Valeurs : remove, vanilla, dungeon, regional, overworld, any_dungeon, keysanity
  shuffle_bosskeys: "dungeon"
  # Placement de la clé de Ganon. remove donne l'accès dès le début. Les variantes de récompense
  # ou de cinématique LACS ne sont pas proposées.
  # Valeurs : remove, vanilla, dungeon, regional, overworld, any_dungeon, keysanity
  shuffle_ganon_bosskey: "dungeon"
  # Placement des cartes et boussoles ; remove ou startwith accorde leurs effets dès le début.
  # Valeurs : remove, startwith, vanilla, dungeon, regional, any_dungeon, keysanity
  shuffle_mapcompass: "dungeon"

  # World
  # closed conserve Mido et le départ de la quête ; open ouvre la sortie et l'Arbre Mojo.
  # Valeurs : closed, open
  open_forest: "closed"
  # open ouvre la grille du Mont du Péril et saute la visite à Zelda. Exige open_forest: open ; la
  # lettre de Zelda et le chant d'Impa sont accordés au départ.
  # Valeurs : closed, open
  open_kakariko: "closed"
  # Le roi Zora bloque le passage normalement, ou ne le bloque jamais.
  # Valeurs : closed, open
  zora_fountain: "closed"
  # Entrer dans Jabu-Jabu sans poisson, une fois le passage du roi Zora libre.
  jabu_open: false
  # Le cycle jour/nuit fonctionne dès le début de la partie.
  time_always_passes: true
  # Dormir jusqu'au matin ou au soir avant Zelda ; exige time_always_passes.
  early_beds: false
  # Secourir quatre charpentiers, un seul, ou commencer avec la forteresse ouverte.
  # Valeurs : normal, fast, open
  gerudo_fortress: "normal"
  # Porte du Temps : terminer Dodongo et Jabu-Jabu, posséder les trois pierres, jouer seulement le
  # Chant du Temps, ou commencer porte ouverte.
  # Valeurs : vanilla, stones, song, open
  door_of_time_condition: "vanilla"
  # Avec la porte ouverte ou le Chant seul : la fuite de Zelda attend les deux donjons, les trois
  # pierres, ou est supprimée avec l'Ocarina dans les douves dès le départ (moat).
  # Valeurs : vanilla, stones, moat
  door_of_time_escape: "moat"
  # Avec les conditions vanilla ou stones, jouer aussi le Chant du Temps pour ouvrir la porte.
  door_of_time_song: true

  # Goal
  # Pont de Ganon : condition native, ou nombre total de pierres et médaillons fixé par
  # bridge_rewards.
  # Valeurs : vanilla, dungeons
  bridge: "vanilla"
  # Nombre de pierres et médaillons requis seulement avec bridge: dungeons.
  # Entier : 0 à 9.
  bridge_rewards: 9
  # Accéder à la tour de Ganon sans terminer les épreuves.
  skip_ganon_trials: false
  # Nombre d'épreuves à terminer si skip_ganon_trials est désactivé.
  # Entier : 0 à 6.
  trials: 6

  # Starting inventory
  # Nombre de cœurs au début de la partie.
  # Entier : 1 à 20.
  starting_hearts: 3
  # Équipement initial natif, retiré du pool local. Pour les améliorations, le plus haut niveau
  # sélectionné l'emporte. Bombchus exige aussi un sac de bombes ; la lettre de Zelda n'est pas
  # disponible.
  # Valeurs : ocarina, slingshot, boomerang, bow, bomb_bag, bombchus, hookshot, longshot,
  # megaton_hammer, lens_of_truth, magic_meter, dins_fire, farores_wind, nayrus_love, fire_arrows,
  # ice_arrows, light_arrows, iron_boots, hover_boots, goron_tunic, zora_tunic, mirror_shield,
  # bottle, magic_beans, stone_of_agony, gerudo_card, goron_bracelet, silver_scale, adult_wallet,
  # kokiri_sword, deku_shield, big_bullet_bag, biggest_bullet_bag, big_quiver, biggest_quiver,
  # big_bomb_bag, biggest_bomb_bag, deku_sticks, big_stick_bag, biggest_stick_bag, deku_nuts,
  # big_nut_bag, biggest_nut_bag, silver_gauntlets, golden_gauntlets, golden_scale, giant_wallet,
  # double_magic, ocarina_of_time, two_bottles, three_bottles, four_bottles, hylian_shield
  starting_items: []
  # Chants connus au départ ; une ocarina reste nécessaire pour les jouer.
  # Valeurs : zeldas_lullaby, eponas_song, sarias_song, suns_song, song_of_time, song_of_storms,
  # minuet_of_forest, bolero_of_fire, serenade_of_water, requiem_of_spirit, nocturne_of_shadow,
  # prelude_of_light
  starting_songs: []
  # Commencer avec une pierre ou un médaillon natif aléatoire. La récompense habituelle existe
  # toujours.
  # Valeurs : off, stone, medal, any
  start_reward: "off"

  # Quality of life
  # Raccourcir les scènes natives de coffres et de remise d'objet.
  faster_chests: false
  # Les blocs à pousser et tirer glissent deux fois plus vite.
  faster_blocks: false
  # Sauter le film d'ouverture et le réveil dans la maison de Link.
  skip_intro: true
  # Supprimer le premier texte de ramassage des petits consommables.
  skip_first_pickup_text: false
  # Déverrouiller le saut des cinématiques : aucun, ouverture/générique, ou aussi les démos du
  # titre.
  # Valeurs : off, story, all
  skip_cutscenes: "off"
  # Un seul cocotte suffit pour la bouteille d'Anju ; la logique suit ce réglage.
  anju_one_cucco: false
  # Un seul grand esprit suffit pour la bouteille du marchand d'âmes.
  big_poe_one: false
  # Navi propose de revenir à l'entrée du donjon, ou aussi à la forêt/au Temple du Temps hors
  # donjons.
  # Valeurs : off, dungeons, everywhere
  navi_return: "everywhere"
  # Masque du Lapin : effet habituel, course accélérée, ou course et sauts amplifiés.
  # Expérimental.
  # Valeurs : off, speed, jump
  bunny_hood: "off"

  # World
  # Le Chant d'Epona suffit à obtenir Epona, sans course contre Ingo.
  skip_epona_race: true
  # Tous les masques sont disponibles lorsque la boutique ouvre.
  skip_mask_quest: false
  # Les haricots magiques sont déjà plantés ; leurs plateformes adultes sont disponibles.
  plant_beans: false
  # Le pont de la vallée Gerudo est réparé dès le début.
  gerudo_bridge_open: false

  # Quality of life
  # Le pont de la salle du lance-pierre de l'Arbre Mojo ne se casse pas.
  deku_bridge_safe: false

  # Difficulty
  # Vie des ennemis et boss en pourcentage (100 = normale). Expérimental.
  # Entier : 50 à 500, pas de 25.
  enemy_health: 100
  # Dégâts des attaques ennemies en pourcentage ; pièges et chutes inchangés. Expérimental.
  # Entier : 50 à 500, pas de 25.
  enemy_damage: 100
  # Vitesse des ennemis en pourcentage ; certaines animations gardent leur rythme. Expérimental.
  # Entier : 75 à 200, pas de 5.
  enemy_speed: 100
  # Densité ennemie en pourcentage (100 = normale), avec limites natives par zone. Expérimental.
  # Entier : 100 à 1000, pas de 50.
  more_enemies: 100
  # Les ennemis vivants récupèrent de la vie après dix secondes sans subir de coup. Expérimental.
  enemy_regen: false
  # Certains ennemis appellent un renfort après un combat prolongé. Expérimental.
  enemy_backup: false
  # Les drops aléatoires ne donnent plus de cœurs de récupération. Expérimental.
  no_heart_drops: false
  # Les pierres à potins ne font plus apparaître de fées. Expérimental.
  no_gossip_fairies: false
  # Les drops aléatoires ne donnent plus de munitions ; boutiques et coffres restent disponibles.
  # Expérimental.
  no_ammo_drops: false
  # Perdre un réceptacle après un Game Over, sans descendre sous trois cœurs. Expérimental.
  lose_heart_on_death: false
  # Interdire l'utilisation des bouteilles pendant la musique de combat. Expérimental.
  no_bottles_in_combat: false
  # Désactiver le verrouillage des ennemis ; les interactions restent utilisables. Expérimental.
  no_z_targeting: false
  # Les captures et recharges natives refusent un contenu déjà présent dans une autre bouteille.
  # Expérimental.
  no_dupe_items: false
  # Les ennemis ordinaires reviennent après avoir quitté leur salle ou zone. Expérimental.
  enemies_respawn_sooner: false
  # Ajouter un mini-boss dans les arènes natives compatibles. Expérimental.
  boss_minibosses: false
  # Ajouter des ennemis mineurs dans les arènes de boss compatibles. Expérimental.
  boss_minions: false
  # Le marchand de haricots propose parfois une réplique sur les mods de difficulté. Expérimental.
  bean_pitch: false
  # Ajouter une embuscade de Skulltulas dans les grottes du Domaine Zora. Expérimental.
  zora_ambush: false
  # Bloquer le passage vers l'Arbre Mojo jusqu'à la défaite des deux Babas, forêt fermée
  # seulement. Expérimental.
  enemy_gates: false
  # Un seul coup sur un cocotte déclenche la revanche de la volaille. Expérimental.
  cucco_revenge: false
  # Autoriser le raccourci natif des deux sticks et de la croix pour invoquer des ennemis
  # d'entraînement. Expérimental.
  enemy_spawn_combo: false
  # Une fée libérée d'une bouteille soigne aussi les ennemis et boss éveillés. Expérimental.
  fairy_helps_enemies: false

  # Partager les morts entre Zelda et Ami.
  death_link: true

  # Huit achats Kokiri uniques, pour les autres joueurs.
  kokiri_shop_checks: true
